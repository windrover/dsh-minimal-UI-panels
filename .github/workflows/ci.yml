name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile is committed yet: install resolves the declared peer and
      # dependency ranges. `--no-audit` keeps the job off the audit endpoint.
      - run: npm install --no-audit --no-fund
      - run: npm test
