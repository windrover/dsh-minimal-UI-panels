# dsh-minimal-ui-panels bundle patch: one host row (real apply — see
# lib/index.js) so the package appears in the loader; the browser half ships
# via exports["./client"] and registers the artifacts / long-term-memory /
# terminal / notes panels as right-Sidebar tab types.
#
# `name` MUST equal package.json's `name` exactly, case included:
# client-modules resolves the browser module by walking up to the package.json
# whose `name` strictly equals this specifier, then requires the bundle to
# register that same id via __ModuleLoader__.load. A case mismatch silently
# drops the whole browser half out of the boot graph while the host half keeps
# working — the failure mode that blanked every panel after the 0.1.5 upgrade.
#
# Applied after dsh-web-app; the user's own cordis.patch.yml can still
# override the row by id.
- insert:
    - id: minimal-ui-panels
      name: dsh-minimal-ui-panels
