# dsh-minimal-UI-panels bundle patch: one host row (real apply — see
# lib/index.js) so the package appears in the loader; the browser half ships
# via exports["./client"] and owns the details container plus all panels.
# Applied after dsh-web-app; the user's own cordis.patch.yml can still
# override the row by id.
- insert:
    - id: minimal-ui-panels
      name: dsh-minimal-UI-panels
